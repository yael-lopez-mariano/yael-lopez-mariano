name: Generate Snake

on:
  schedule:
    - cron: "0 1 * * *" # corre diario 01:00 UTC
  workflow_dispatch: # permite ejecutarlo manualmente

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download snake action
        uses: actions/checkout@v4
        with:
          repository: Platane/snk
          ref: v3
          path: .snake-action
          persist-credentials: false

      - name: Limit contributions to the current year
        shell: python
        run: |
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          year = now.astimezone(ZoneInfo("America/Mexico_City")).year

          start = f"{year}-01-01T00:00:00Z"
          end = now.strftime("%Y-%m-%dT%H:%M:%SZ")

          selection = (
              f'contributionsCollection(from: "{start}", to: "{end}") {{'
          )

          # Escapar las comillas para el JavaScript de la acción.
          replacement = json.dumps(selection)[1:-1]

          pattern = re.compile(
              r"\bcontributionsCollection\s*(?:\([^)]*\))?\s*\{"
          )

          replacements = 0

          for path in Path(".snake-action").rglob("*.js"):
              original = path.read_text(encoding="utf-8")
              updated, count = pattern.subn(
                  lambda match: replacement,
                  original,
              )

              if count:
                  path.write_text(updated, encoding="utf-8")
                  replacements += count

          if replacements == 0:
              raise RuntimeError(
                  "No se encontró la consulta de contribuciones. "
                  "Revisa si cambió la estructura de Platane/snk."
              )

          print(f"Contribuciones seleccionadas: {start} hasta {end}")

      - name: Generate snake svgs
        uses: ./.snake-action/svg-only
        with:
          github_user_name: yael-lopez-mariano
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/snake-github-dark.svg?color_snake=%23a855f7&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2339d353&background=%230e1117

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
